<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <clipPath id="flag">
      <rect y="4" width="24" height="16" rx="2.5" />
    </clipPath>
    <!-- qizil diagonallar markazga nisbatan siljigan: har chorakda faqat bir yarmi -->
    <clipPath id="diagonals">
      <path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z" />
    </clipPath>
  </defs>
  <g clip-path="url(#flag)">
    <svg y="4" width="24" height="16" viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice">
      <rect width="60" height="30" fill="#012169" />
      <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
      <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#diagonals)" stroke="#c8102e" stroke-width="4" />
      <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10" />
      <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6" />
    </svg>
  </g>
  <rect x="0.5" y="4.5" width="23" height="15" rx="2" fill="none" stroke="#000" stroke-opacity="0.18" />
</svg>
